# Supabase project configuration.
#
# Applied with:  npx supabase config push
#
# NOTE: `config push` is declarative — it pushes this whole file, so anything
# omitted falls back to CLI defaults. Everything this project relies on is
# therefore stated explicitly, even where it matches the default.

project_id = "macronaut"

[auth]
enabled = true
# Where Supabase sends people after an email link. Change to your deployed URL.
site_url = "https://macronaut-lemon.vercel.app"
# Every origin allowed to receive an OAuth redirect. Add your deployed domain.
additional_redirect_urls = [
  "https://macronaut-lemon.vercel.app/auth/callback",
  "https://macronaut-lemon.vercel.app",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Leave on for a public app. Turn off for a personal install so the first
# sign-up does not have to wait on Supabase's rate-limited built-in mailer.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m"
# Hosted Supabase defaults to 8; the CLI default is 6, and `config push` would
# quietly weaken it every time if it were not stated here.
otp_length = 8
otp_expiry = 3600

# Same story: the hosted default has TOTP enrolment on, the CLI default has it
# off. Declared explicitly so a push never silently removes it.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# Google sign-in.
#
# The credentials come from Google Cloud Console -> APIs & Services ->
# Credentials -> OAuth client ID (Web application), with this authorised
# redirect URI:
#
#   https://kseigysuhnueleuupovq.supabase.co/auth/v1/callback
#
# `env(...)` keeps the secret out of the repo — set both in your shell (or a
# .env file the CLI can see) before running `supabase config push`.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
skip_nonce_check = false
