name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src tests

      - name: Unit tests
        run: npm test

      # No secrets: the app is designed to build and run without Supabase or
      # Gemini configured, so a build here proves that path still works.
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite drives the runner's preinstalled Chrome rather than
      # downloading a browser, matching how it runs locally.
      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e
