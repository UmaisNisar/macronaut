name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build first, and not just for speed. Next generates PageProps and
      # LayoutProps into .next/types during a build, and those are globals the
      # app's own files reference — so a fresh clone cannot typecheck until it
      # has built once. Running with no secrets also proves the app still
      # builds without Supabase or Gemini configured.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src tests

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite drives the runner's preinstalled Chrome rather than
      # downloading a browser, matching how it runs locally.
      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e
